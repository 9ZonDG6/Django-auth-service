[project]
name = "django-auth-service"
version = "0.2.4"
description = "Shared authentication service built with Django and Django REST Framework."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0.5",
    "django-axes[ipware]>=8.3.1",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.13.0",
    "django-permissions-policy>=4.30.0",
    "django-filter>=25.2",
    "django-filter-stubs>=0.1.3",
    "django-safe-migrations>=0.6.0",
    "django-silk>=5.5.0",
    "django-split-settings>=1.3.2",
    "djangorestframework>=3.17.1",
    "drf-spectacular>=0.29.0",
    "psycopg[binary]>=3.3.4",
    "pygments>=2.20.0",
    "sqlparse>=0.5.5",
    "djangorestframework-simplejwt[crypto]>=5.5.1",
    "pyjwt>=2.13.0",
    "django-zeal>=2.2.4",
    "argon2-cffi>=25.1.0",
]

[dependency-groups]
dev = [
    "django-extra-checks>=0.17.0",
    "django-query-counter>=0.5.0",
    "django-stubs>=6.0.4",
    "djangorestframework-stubs>=3.17.0",
    "dotenv-linter>=0.7.0",
    "dump-env>=1.7.0",
    "import-linter>=2.11",
    "ipython>=9.13.0",
    "pre-commit>=4.6.0",
    "pytest-django>=4.12.0",
    "ruff>=0.15.14",
    "ty>=0.0.39",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["apps/*/tests"]

[tool.importlinter]
root_packages = [
    "common",
    "config",
]
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Common must not import config"
type = "forbidden"
source_modules = [
    "common",
]
forbidden_modules = [
    "config",
]

[tool.ruff]
target-version = "py314"
line-length = 120
indent-width = 4

exclude = [
    "venv",
    ".venv",
    "migrations",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"
avoid-escape = true

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.cast".msg = "Исправлять типизацию через cast не правильно. Используйте аннотации или isinstance."

[tool.ruff.lint.isort]
split-on-trailing-comma = true

[tool.ruff.lint.flake8-bandit]
check-typed-exception = true

[tool.ruff.lint.per-file-ignores]
"**/tests/*.py" = ["assert", "hardcoded-password-string", "hardcoded-password-func-arg"]
"**/apps.py" = ["undocumented-public-class"]
"config/settings/__init__.py" = ["non-empty-init-module"]
"**/base_model.py" = ["undocumented-public-nested-class"]
"manage.py" = ["import-outside-top-level"]

[tool.ruff.lint]
preview = true

mccabe.max-complexity = 6
pydocstyle.convention = "google"

select = [  # https://docs.astral.sh/ruff/rules/
    "A",     # flake8-builtins
    "ANN",   # flake8-annotations
    "ARG",   # flake8-unused-arguments
    "ASYNC", # flake8-async
    "B",     # flake8-bugbear
    "BLE",   # flake8-blind-except
    "C4",    # flake8-comprehensions
    "C90",   # mccabe
    "COM",   # flake8-commas
    "D",     # pydocstyle
    "DOC",   # pydoclint
    "DTZ",   # flake8-datetimez
    "DJ",    # flake8-django
    "E",     # pycodestyle errors
    "EM",    # flake8-errmsg
    "ERA",   # eradicate
    "EXE",   # flake8-executable
    "F",     # pyflakes
    "FA",    # flake8-future-annotations
    "FBT",   # flake8-boolean-trap
    "FIX",   # flake8-fixme
    "FLY",   # flynt
    "FURB",  # refurb
    "G",     # flake8-logging-format
    "I",     # isort
    "ICN",   # flake8-import-conventions
    "INP",   # flake8-no-pep420
    "INT",   # flake8-gettext
    "ISC",   # flake8-implicit-str-concat
    "LOG",   # flake8-logging
    "N",     # pep8-naming
    "PERF",  # perflint
    "PGH",   # pygrep-hooks
    "PIE",   # flake8-pie
    "PL",    # pylint
    "PT",    # flake8-pytest-style
    "PTH",   # flake8-use-pathlib
    "PYI",   # flake8-pyi
    "Q",     # flake8-quotes
    "RET",   # flake8-return
    "RSE",   # flake8-raise
    "RUF",   # Ruff-specific rules
    "S",     # flake8-bandit
    "SIM",   # flake8-simplify
    "SLF",   # flake8-self
    "SLOT",  # flake8-slots
    "T10",   # flake8-debugger
    "T20",   # flake8-print
    "TC",    # flake8-type-checking
    "TD",    # flake8-todos
    "TID",   # flake8-tidy-imports
    "TRY",   # tryceratops
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
    "YTT",   # flake8-2020
]

ignore = [
    "missing-trailing-comma",    # trailing comma missing
    "undocumented-public-module",
    "undocumented-public-package",
    "docstring-missing-exception",
    "docstring-missing-returns",
    "raw-string-in-exception",
    "raise-vanilla-args",    # long exception messages from `tryceratops`
    "ambiguous-unicode-character-string",    # ambiguous unicode character in string: Cyrillic vs Latin
    "ambiguous-unicode-character-docstring",    # ambiguous unicode character in docstring: Cyrillic
    "ambiguous-unicode-character-comment",    # ambiguous unicode character in comment: Cyrillic vs Latin
    "undocumented-public-nested-class",
    # "D105",
    # "D107",
    # "PLR6301",   # do not require classmethod / staticmethod when self not used
    #--------------------------
    # # Конфликты / предупреждения при использовании ruff format
    # "COM819",
    # "D203",
    # "D206",
    # "D300",
    # "Q000",
    # "Q001",
    # "Q002",
    # "Q003",
    # "Q004",
    # "ISC002",

    # # Очень душные для Django/DRF
    # "ANN401",
    # "ARG002",
    # "FBT001",
    # "FBT002",
    # "PLR0913",
    # "PLR2004",

    # # Часто шумят в шаблонах, settings и тестах
    # "S101",
    # "S105",
    # "S106",
    # "S107",
    # "S104",

    # # Если не хочешь обязательные copyright headers
    # "CPY001",
    #--------------------------
    # "ANN401",
    # "B904",
    # "DJ008",
    # "DJ001",     # avoid using null=True on string-based fields
    # "S104",
    # "S105",
    # "S107",
    # "S603",
    # "S605",
    # "S404",
    # "S607",
    # "RUF003",    # ambiguous unicode character in comment
    # "RUF067",    # detects the presence of code in __init__.py files
    # "PTH118",    # os.path.join (pathlib not always better)
    # "ARG002",    # unused method argument
    # "ARG005",    # unused lambda argument
    # "A005",   # allow to shadow stdlib and builtin module names
    # # Different doc rules that we don't really care about:
    # "D203",
    # "D212",
    # "D401",
    # "D404",
    # "D405",
    # "ISC001",  # implicit string concat conflicts with `ruff format`
    # "ISC003",  # prefer explicit string concat over implicit concat
    # "PLR09",   # we have our own complexity rules
    # "PLR2004", # do not report magic numbers
]
