{% extends "drf_spectacular/redoc.html" %}
{% block head %}
<title>{{ title|default:"ReDoc" }}</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style nonce="{{ request.csp_nonce }}">
  body { margin: 0; padding: 0; }
</style>
{% endblock head %}
{% block body %}
{% if settings %}
<div id="redoc-container"></div>
<script src="{{ redoc_standalone }}"></script>
<script nonce="{{ request.csp_nonce }}">
  const redocSettings = {{ settings|safe }};
  Redoc.init("{{ schema_url|escapejs }}", redocSettings, document.getElementById('redoc-container'));
</script>
{% else %}
<redoc spec-url="{{ schema_url }}"></redoc>
<script src="{{ redoc_standalone }}"></script>
{% endif %}
{% endblock body %}
