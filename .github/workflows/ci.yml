name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Create environment file
        run: cp .env.example .env

      - name: Run checks
        run: make check PYTEST_ARGS="--cov --cov-report=term-missing --cov-report=xml"

      - name: Apply and check migrations
        run: |
          uv run python manage.py migrate --noinput
          uv run python manage.py migrate --check

      - name: Fail if checks modified any file
        run: git diff --exit-code

      - name: Check production settings
        env:
          ENVIRONMENT: production
        run: make check-deploy

  integration:
    name: HTTP integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current service
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: auth
      - name: Check out companion service
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: 9ZonDG6/Django-tasks-service
          path: tasks
      - name: Use matching companion branch when available
        working-directory: tasks
        env:
          PAIR_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads origin "refs/heads/$PAIR_BRANCH" >/dev/null; then
            git fetch origin "refs/heads/$PAIR_BRANCH"
            git checkout --detach FETCH_HEAD
          fi
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - name: Install both services
        run: |
          cp auth/.env.example auth/.env
          cp tasks/.env.example tasks/.env
          uv sync --locked --project auth
          uv sync --locked --project tasks
      - name: Test real HTTP interaction
        working-directory: auth
        env:
          TASKS_SERVICE_DIR: ${{ github.workspace }}/tasks
        run: uv run pytest integration/test_tasks_compatibility.py -q
